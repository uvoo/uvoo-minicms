{{- if .Values.gateway.enabled }}
{{- if not .Values.gateway.host }}
{{- fail "gateway.host is required when gateway.enabled=true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "uvoo-minicms.fullname" . }}
  labels:
    {{- include "uvoo-minicms.labels" . | nindent 4 }}
spec:
  hostnames:
    - {{ .Values.gateway.host | quote }}
  parentRefs:
    - name: {{ include "uvoo-minicms.gatewayName" . }}
      {{- if .Values.gateway.listeners.https.enabled }}
      sectionName: https
      {{- else }}
      sectionName: http
      {{- end }}
  rules:
    {{- if .Values.ha.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /cms.v1.CMSService
      backendRefs:
        - name: {{ include "uvoo-minicms.writerServiceName" . }}
          port: {{ .Values.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - name: {{ include "uvoo-minicms.writerServiceName" . }}
          port: {{ .Values.service.port }}
    {{- end }}
    - matches:
        - path:
            type: {{ .Values.gateway.pathType }}
            value: {{ .Values.gateway.path | quote }}
      backendRefs:
        - name: {{ include "uvoo-minicms.fullname" . }}
          port: {{ .Values.service.port }}
---
{{- if and .Values.gateway.redirect.httpToHttps .Values.gateway.listeners.http.enabled .Values.gateway.listeners.https.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "uvoo-minicms.fullname" . }}-https-redirect
  labels:
    {{- include "uvoo-minicms.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "uvoo-minicms.gatewayName" . }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      matches:
        - path:
            type: PathPrefix
            value: /
---
{{- end }}
{{- if and .Values.gateway.redirect.fromToWWW .Values.gateway.listeners.https.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "uvoo-minicms.fullname" . }}-www-redirect
  labels:
    {{- include "uvoo-minicms.labels" . | nindent 4 }}
spec:
  hostnames:
    - {{ include "uvoo-minicms.gatewayRedirectHost" . | quote }}
  parentRefs:
    - name: {{ include "uvoo-minicms.gatewayName" . }}
      sectionName: https
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: {{ .Values.gateway.host | quote }}
            statusCode: 301
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
{{- end }}
